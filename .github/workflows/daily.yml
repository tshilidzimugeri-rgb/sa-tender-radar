name: Daily tender run

on:
  schedule:
    - cron: "0 4 * * 1-5"   # 06:00 SAST, Monday to Friday
    - cron: "0 3 1 * *"     # 05:00 SAST on the 1st: also refresh the training corpus
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh training corpus
        if: github.event.schedule == '0 3 1 * *'
        run: python -m scripts.build_corpus

      - name: Fetch, classify, brief and notify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          APP_URL: ${{ vars.APP_URL }}
        run: python -m scripts.run_daily

      - name: Commit updated data
        run: |
          git config user.name "tender-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data update $(TZ=Africa/Johannesburg date +'%Y-%m-%d')"
            git push
          fi
